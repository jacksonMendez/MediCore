<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4FA8A0" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="50%" stop-color="#0b131e"/>
      <stop offset="100%" stop-color="#0f1a28"/>
    </linearGradient>
  </defs>

  <!-- Background dark slate matching login page -->
  <rect width="900" height="400" rx="24" fill="url(#bg-dark)"/>
  <rect width="898" height="398" x="1" y="1" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Icono del Login: rounded-xl #4FA8A0 con pulso M22 12h-4l-3 9L9 3l-3 9H2 -->
  <g transform="translate(400, 70)" filter="url(#glow-teal)">
    <rect width="100" height="100" rx="24" fill="#4FA8A0"/>
    <g transform="translate(14, 14) scale(3)">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Tipografía: MediCoreOS -->
  <text x="450" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#E8EDF2">MediCore</tspan><tspan fill="#4FA8A0">OS</tspan>
  </text>

  <!-- Subtítulo -->
  <text x="450" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#5A7A94" letter-spacing="0.5">
    Acceso seguro al sistema clínico
  </text>
</svg>