      - BearerAuth: []
      - {}
      responses:
        '201':
          description: Paciente pre-registrado. Requiere validación de código OTP.
        '400':
          description: Validación fallida en los datos enviados.
        '403':
          description: Intento de autoregistro con un rol no autorizado.
        '409':
          description: El correo electrónico ya se encuentra registrado.
