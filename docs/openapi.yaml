  /api/chat/mensaje:
    post:
      operationId: chat_mensaje_create
      description: |-
        Envía un mensaje a la sesión de chat con el orquestador Groq. Gestiona el flujo de agendamiento clínico determinista, consultas de disponibilidad, cancelaciones y PQR. La respuesta incluye campos de interfaz estructurados:
        - `requiere_seleccion`: "ninguna" (texto informativo o confirmación), "dia" (renderizar calendario de días), "hora" (renderizar botones de horarios).
        - `dias_disponibles`: lista de fechas activas YYYY-MM-DD cuando requiere_seleccion="dia".
        - `horarios`: lista de slots disponibles en formato 12h cuando requiere_seleccion="hora".
        - `actualizo_citas`: booleano que notifica al frontend si debe refrescar sus widgets de citas.
        Roles permitidos: paciente, medico, admin, agente_atencion.
      summary: Enviar mensaje al Copiloto Clínico IA
      tags:
      - Chatbot LLM
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
          description: ''
        '400':
          description: Mensaje vacío o formato de petición inválido.
        '401':
          description: Usuario no autenticado (requiere JWT).
        '404':
          description: Sesión de chat no encontrada.
  /api/chat/mensaje/:
    post:
      operationId: chat_mensaje_create_2
      description: |-
        Envía un mensaje a la sesión de chat con el orquestador Groq. Gestiona el flujo de agendamiento clínico determinista, consultas de disponibilidad, cancelaciones y PQR. La respuesta incluye campos de interfaz estructurados:
        - `requiere_seleccion`: "ninguna" (texto informativo o confirmación), "dia" (renderizar calendario de días), "hora" (renderizar botones de horarios).
        - `dias_disponibles`: lista de fechas activas YYYY-MM-DD cuando requiere_seleccion="dia".
