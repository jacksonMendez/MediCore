tags:
- name: Auth
  description: Autenticación JWT, verificación de sesión y roles.
- name: Chatbot LLM
  description: Asistente conversacional clínico con orquestación Groq y failover.
- name: Citas
  description: Disponibilidad médica, creación, consulta y cancelación de citas.
- name: Pagos
  description: Simulación de pagos, webhooks y transacciones.
- name: PQR & Reembolsos
  description: Gestión de Peticiones, Quejas, Reclamos y solicitudes de reembolso.
- name: Médicos
  description: Gestión del cuerpo médico, agenda clínica y turnos.
- name: Sedes
  description: Sedes físicas e infraestructura de atención.
- name: Especialidades
  description: Catálogo de especialidades médicas y tarifas base.
- name: Auditoría
  description: Trazabilidad inmutable de eventos clínicos, REST y bot_llm (Admin).
