openapi: 3.0.3
info:
  title: MediCore OS — API Clínica Inteligente
  version: 2.0.0
  description: Documentación OpenAPI / Swagger oficial de MediCore OS. Plataforma
    integral de gestión hospitalaria, agendamiento de citas, copiloto clínico con
    IA (Groq failover), pasarela de pagos, PQR y auditoría inmutable.
paths:
  /api/auditoria/:
    get:
      operationId: auditoria_list
      description: Consulta paginada de eventos históricos inmutables registrados
        automáticamente en el servidor. Cubre acciones humanas (paciente, médico,
        admin, agente) y autónomas del asistente IA (`origen="bot_llm"`). Permite
        filtrar por `usuario_id`, `accion`, `origen`, `entidad_tipo`, `fecha_inicio`
        y `fecha_fin`. Acceso estrictamente reservado al rol `admin`.
      summary: Consultar registro inmutable de auditoría clínica y de sistema
      parameters:
      - in: query
        name: accion
        schema:
          type: string
        description: Filtrar por código de acción (cita_creada, cita_cancelada, login_exitoso,
          etc.)
      - in: query
        name: entidad_tipo
        schema:
          type: string
        description: Filtrar por tipo de recurso (Cita, Pago, Usuario, PQRSolicitud)
      - in: query
        name: fecha_fin
        schema:
          type: string
        description: 'Timestamp ISO final (ej: 2026-09-30T23:59:59Z)'
      - in: query
        name: fecha_inicio
        schema:
          type: string
        description: 'Timestamp ISO inicial (ej: 2026-09-01T00:00:00Z)'
      - in: query
        name: origen
        schema:
          type: string
        description: Filtrar por origen (bot_llm, humano_paciente, humano_medico,
          humano_admin, sistema)
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página
      - in: query
        name: page_size
        schema:
          type: integer
        description: Tamaño de página (default 20, max 100)
      - in: query
        name: usuario_id
        schema:
          type: string
        description: Filtrar por UUID de usuario
      tags:
      - Auditoría
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroAuditoria'
          description: ''
        '401':
          description: No autenticado.
        '403':
          description: 'Acceso denegado: solo administradores pueden auditar.'
  /api/auditoria/registros:
    get:
